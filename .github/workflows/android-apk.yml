name: Build Frontline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontline
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" -O "$HOME/android-cmdline-tools.zip"
          mkdir -p "$HOME/android-cmdline-tools"
          unzip -q "$HOME/android-cmdline-tools.zip" -d "$HOME/android-cmdline-tools"
          mv "$HOME/android-cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.7.2 and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -O "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -O "$HOME/godot/templates.tpz"
          mkdir -p "$HOME/godot/templates"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Android export preset and SDK paths
        shell: bash
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Frontline-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="26"
          gradle_build/target_sdk="35"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.example.frontline"
          package/name="Frontline"
          package/signed=false
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          permissions/internet=false
          EOF
          mkdir -p build "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot project resources
        shell: bash
        run: |
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --export-debug "Android" build/Frontline-debug.apk
          test -s build/Frontline-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-debug-APK
          path: build/Frontline-debug.apk
          if-no-files-found: error
